site_name: Nohor.net

theme:
  name: material
  logo: assets/art.jpg
  favicon: assets/a.jpg

  palette:
    scheme: default
    primary: light green
    accent: orange

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets