site_name: Nohor.net

theme:
  name: material
  logo: assets/revy_2.jpg
  favicon: assets/revy_2.jpg

  palette:
    scheme: default
    primary: light green
    accent: orange

extra:
  generator: false

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets